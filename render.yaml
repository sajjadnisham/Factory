# Render Blueprint — deploys the storefront and a PostgreSQL database together.
#
# Use it from https://dashboard.render.com/select-repo?type=blueprint, pointing
# at this repository. Render reads this file, provisions both services and
# wires DATABASE_URL. Migrations run from the container entrypoint on boot.
#
# No post-deploy shell commands are needed: the container provisions itself on
# first boot from SEED_DEMO_DATA and ADMIN_INITIAL_PASSWORD below. Render's free
# plan has no web shell, so anything requiring one would be unreachable.

databases:
  - name: mensstore-db
    databaseName: mensstore
    user: storeapp
    plan: free

services:
  - type: web
    name: mensstore
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    # Migrations run from the container entrypoint rather than a
    # preDeployCommand, which Render offers on paid plans only.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mensstore-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false        # set to the service URL once Render assigns it
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STOCK_PATH
        value: ./stock
      - key: PAYMENT_PROVIDER
        value: manual
      # Demo mode: no SMS gateway, verification codes are shown on screen and
      # every page carries a banner saying so. This is an authentication bypass
      # — anyone can sign in as any phone number — and exists only so the store
      # can be shown to people. Switch to "http" with a real gateway (and add
      # SMS_HTTP_ENDPOINT and SMS_HTTP_API_KEY) before taking real orders.
      - key: OTP_PROVIDER
        value: demo

      # First-boot provisioning, because the free plan has no shell to run the
      # setup commands from. Both are handled by the container entrypoint.
      #
      # Loads the 18-product demo catalogue with customers and order history,
      # once, only while the catalogue is empty.
      - key: SEED_DEMO_DATA
        value: "1"
      # Creates the /admin login. Set the password in the dashboard, then clear
      # it from the environment once the user exists.
      - key: ADMIN_INITIAL_USERNAME
        value: admin
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
